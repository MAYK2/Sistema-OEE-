{% extends "base.html" %}

{% block title %}Iniciar Sesión - Grammar OEE{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-lg border-0 rounded-lg">
            <div class="card-header bg-primary text-white text-center py-4">
                <i class="bi bi-shield-lock-fill display-4"></i>
                <h4 class="mt-2 text-white">Administración</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuario</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                            <input type="text" class="form-control" id="username" name="username" required autofocus>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">Acceder</button>
                    </div>
                </form>
                {% if error %}
                <div class="alert alert-danger mt-3 mb-0 text-center">
                    {{ error }}
                </div>
                {% endif %}
            </div>
            <div class="card-footer text-center py-3">
                <a href="{{ url_for('views.create_order') }}" class="text-decoration-none small">
                    <i class="bi bi-arrow-left"></i> Volver a Carga de OT
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
