{% extends 'base.html' %}

{% block content %}
<style>
    /* Desktop Mode: Lock scroll for app-like experience */
    @media (min-width: 992px) {

        html,
        body {
            overflow: hidden;
        }

        .h-lg-100 {
            height: 100% !important;
        }

        .overflow-lg-auto {
            overflow: auto !important;
        }
    }

    /* Tablet/Mobile: Allow native scrolling */
    @media (max-width: 991.98px) {
        body {
            overflow-y: auto;
            /* Ensure footer doesn't overlap content */
            padding-bottom: 80px;
        }

        .h-100-mobile-auto {
            height: auto !important;
        }
    }
</style>
<div class="row h-lg-100 g-0">
    <div class="col-12 h-lg-100">
        <div class="card shadow h-lg-100 border-0">
            <div class="card-header bg-primary text-white py-2">
                <h4 class="card-title mb-0 fs-5"><i class="bi bi-cpu-fill me-2"></i>Nueva Orden de Producción</h4>
            </div>
            <div class="card-body p-0">
                <form id="orderForm" class="h-lg-100 d-flex flex-column">
                    <div class="row g-0 h-lg-100">
                        <!-- Left Panel: Client & Planning -->
                        <div class="col-lg-4 col-12 bg-light border-end p-3 d-flex flex-column overflow-lg-auto">
                            <!-- 1. Cliente -->
                            <div class="mb-3">
                                <h6 class="fw-bold text-primary mb-2"><i class="bi bi-people-fill me-2"></i>Cliente</h6>
                                <div class="btn-group w-100 mb-2" role="group">
                                    <input type="radio" class="btn-check" name="client_mode" id="mode_existing"
                                        value="existing" checked onclick="toggleClientMode()">
                                    <label class="btn btn-outline-secondary btn-sm"
                                        for="mode_existing">Existente</label>

                                    <input type="radio" class="btn-check" name="client_mode" id="mode_new" value="new"
                                        onclick="toggleClientMode()">
                                    <label class="btn btn-outline-secondary btn-sm" for="mode_new">Nuevo</label>
                                </div>

                                <div id="section_existing_client">
                                    <select class="form-select" id="existing_client_id">
                                        <option value="">Buscar cliente...</option>
                                        {% for client in clients %}
                                        <option value="{{ client.id }}">{{ client.name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>

                                <div id="section_new_client" style="display: none;">
                                    <input type="text" class="form-control mb-2" id="new_client_name"
                                        placeholder="Nombre / Empresa">
                                    <input type="tel" class="form-control mb-2" id="new_client_phone"
                                        placeholder="Teléfono">
                                    <input type="email" class="form-control" id="new_client_email"
                                        placeholder="Email (Opcional)">
                                </div>
                            </div>

                            <hr class="my-2">

                            <!-- 3. Planificación -->
                            <div class="mb-3">
                                <h6 class="fw-bold text-primary mb-2"><i
                                        class="bi bi-calendar-event me-2"></i>Planificación</h6>
                                <div class="mb-2">
                                    <label class="form-label small text-muted mb-0">Inicio</label>
                                    <input type="datetime-local" class="form-control form-control-sm bg-white"
                                        value="{{ today_date }}" readonly>
                                </div>
                                <div>
                                    <label for="estimated_finish" class="form-label small text-muted mb-0">Fecha
                                        Estimada de Entrega</label>
                                    <input type="datetime-local" class="form-control form-control-sm"
                                        id="estimated_finish">
                                </div>
                            </div>

                            <div class="mt-3 pt-3">
                                <button type="button" class="btn btn-success w-100 py-3 fw-bold shadow-sm"
                                    onclick="submitOrders()">
                                    <i class="bi bi-check-lg me-2"></i>CREAR ÓRDENES
                                </button>
                            </div>
                        </div>

                        <!-- Right Panel: Products -->
                        <div class="col-lg-8 col-12 p-3 d-flex flex-column h-lg-100">
                            <!-- Helper / Add Product -->
                            <div class="mb-3">
                                <h6 class="fw-bold text-primary mb-2"><i class="bi bi-cart-plus-fill me-2"></i>Productos
                                </h6>
                                <div class="card bg-light border-0">
                                    <div class="card-body p-2">
                                        <div class="row g-2 align-items-end">
                                            <div class="col-7">
                                                <label class="form-label small text-muted mb-0">Producto</label>
                                                <select class="form-select" id="product_select">
                                                    <option value="">Seleccione...</option>
                                                    {% for product in products %}
                                                    <option value="{{ product.id }}">{{ product.name }}</option>
                                                    {% endfor %}
                                                </select>
                                            </div>
                                            <div class="col-3">
                                                <label class="form-label small text-muted mb-0">Cant.</label>
                                                <input type="number" class="form-control" id="quantity_input" min="1"
                                                    placeholder="0">
                                            </div>
                                            <div class="col-2">
                                                <button type="button" class="btn btn-primary w-100" onclick="addItem()">
                                                    <i class="bi bi-plus-lg"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Scrollable Table -->
                            <div class="flex-grow-1 overflow-auto border rounded bg-white">
                                <table class="table table-striped table-hover mb-0 sticky-top-header">
                                    <thead class="table-dark sticky-top">
                                        <tr>
                                            <th class="py-2 ps-3">Producto</th>
                                            <th class="py-2" style="width: 100px;">Cant.</th>
                                            <th style="width: 60px;"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="itemsBody">
                                        <tr id="emptyRow">
                                            <td colspan="3" class="text-center text-muted fst-italic py-5 align-middle">
                                                <div class="d-flex flex-column align-items-center">
                                                    <i class="bi bi-basket display-6 mb-2 opacity-50"></i>
                                                    <span>Sin productos</span>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    let serverItems = [];

    function toggleClientMode() {
        const mode = document.querySelector('input[name="client_mode"]:checked').value;
        const sectionExisting = document.getElementById('section_existing_client');
        const sectionNew = document.getElementById('section_new_client');

        if (mode === 'existing') {
            sectionExisting.style.display = 'block';
            sectionNew.style.display = 'none';
        } else {
            sectionExisting.style.display = 'none';
            sectionNew.style.display = 'block';
        }
    }

    function addItem() {
        const productSelect = document.getElementById('product_select');
        const quantityInput = document.getElementById('quantity_input');

        const productId = productSelect.value;
        const productName = productSelect.options[productSelect.selectedIndex].text;
        const quantity = parseInt(quantityInput.value);

        if (!productId || !quantity || quantity < 1) {
            Swal.fire({
                icon: 'info',
                title: 'Datos incompletos',
                text: 'Por favor seleccione un producto y una cantidad válida.'
            });
            return;
        }

        // Add to array
        serverItems.push({
            product_id: productId,
            product_name: productName,
            quantity: quantity
        });

        // Reset inputs
        productSelect.value = "";
        quantityInput.value = "";

        renderTable();
    }

    function removeItem(index) {
        serverItems.splice(index, 1);
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('itemsBody');
        tbody.innerHTML = '';

        if (serverItems.length === 0) {
            tbody.innerHTML = `
                <tr id="emptyRow">
                    <td colspan="3" class="text-center text-muted fst-italic py-3">
                        No hay productos agregados a la lista.
                    </td>
                </tr>`;
            return;
        }

        serverItems.forEach((item, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="align-middle py-2 ps-3 small fw-bold">${item.product_name}</td>
                <td class="align-middle py-2 small">${item.quantity}</td>
                <td class="text-center align-middle">
                    <button type="button" class="btn btn-outline-danger btn-sm border-0" onclick="removeItem(${index})">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    function submitOrders() {
        if (serverItems.length === 0) {
            Swal.fire({
                icon: 'warning',
                title: 'Lista vacía',
                text: 'Agregue al menos un producto a la lista.'
            });
            return;
        }

        const clientMode = document.querySelector('input[name="client_mode"]:checked').value;
        let payload = {
            client_mode: clientMode,
            items: serverItems,
            estimated_finish: document.getElementById('estimated_finish').value
        };

        if (clientMode === 'existing') {
            const clientId = document.getElementById('existing_client_id').value;
            if (!clientId) {
                Swal.fire({ icon: 'warning', title: 'Falta Cliente', text: 'Seleccione un cliente existente.' });
                return;
            }
            payload.existing_client_id = clientId;
        } else {
            const name = document.getElementById('new_client_name').value;
            if (!name) {
                Swal.fire({ icon: 'warning', title: 'Falta Cliente', text: 'Ingrese el nombre del nuevo cliente.' });
                return;
            }
            payload.new_client_name = name;
            payload.new_client_phone = document.getElementById('new_client_phone').value;
        }

        // Show Loading
        Swal.fire({
            title: 'Creando Órdenes...',
            text: 'Por favor espere',
            allowOutsideClick: false,
            didOpen: () => {
                Swal.showLoading();
            }
        });

        // Send JSON
        fetch("{{ url_for('views.create_order') }}", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
            .then(response => {
                if (response.ok) {
                    return response.json();
                }
                throw new Error('Error en el servidor');
            })
            .then(data => {
                // Success Alert with Timer
                Swal.fire({
                    icon: 'success',
                    title: '¡Órdenes Creadas!',
                    text: 'Se han generado las órdenes de producción correctamente.',
                    timer: 2500,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = "{{ url_for('views.index') }}";
                });
            })
            .catch(error => {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: "No se pudieron crear las órdenes: " + error.message
                });
            });
    }
</script>
{% endblock %}
